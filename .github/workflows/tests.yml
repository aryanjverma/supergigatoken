# Test workflow. Separate from CI.yml on purpose: that file is generated by
# `maturin generate-ci github` and only builds wheels, so anything added there
# is lost the next time it is regenerated.
name: tests

on:
  push:
    branches: [main, master, v4]
  # Everything else (feature branches) gets a run when it opens a PR.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Hermetic: no network, no HuggingFace cache. Tests whose corpus is absent
  # skip themselves (`test_data::corpus_or_skip`) and GPT-2 falls back to the
  # committed fixture in tests/fixtures, so this job is meaningful on a bare
  # runner. `rust-toolchain.toml` pins the nightly the crate needs
  # (portable_simd, profile-rustflags).
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Both module trees: src/lib.rs and the separate src/main.rs bin target,
      # which has its own `mod` list (see CLAUDE.md). A change that compiles in
      # one can fail in the other, so --lib alone is not enough.
      - run: cargo test --lib
      - run: cargo test --bins

  # Needs network: the parity fixtures resolve tokenizer.json from the standard
  # HF cache and download misses (tests/hf_cache.py -> hub_file), which on a
  # fresh runner means every repo in tests/conftest.py is fetched — roughly
  # 300 MB, most of it the 135 MB DCLM shard `dclm_docs` selects from. The cache
  # step below covers all of it (one directory), and `restore-keys` means a
  # conftest edit reuses the previous cache rather than re-downloading.
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Cache HuggingFace tokenizer files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tokenizers-${{ hashFiles('tests/conftest.py', 'tests/tokenizers/conftest.py') }}
          restore-keys: hf-tokenizers-
      # uv builds the extension on first run, and `[profile.release] lto = "fat"`
      # makes that slow — measured at ~20 minutes from cold on comparable
      # hardware. `rust-cache` above is what keeps later runs cheap; if the
      # first-run wall clock is unacceptable, pass `--profile dev` through
      # MATURIN_PEP517_ARGS, at the cost of a much slower suite (the DCLM tests
      # encode ~20 MB through the extension).
      # PYTHONIOENCODING keeps the non-Latin assertions printable if one fails.
      - run: uv run pytest tests -q
        env:
          PYTHONIOENCODING: utf-8
          # 0 would read the whole ~12 GB corpus; the OWT tests skip when the
          # file is absent, which it is on a runner, so this only bounds the
          # case where someone mounts one.
          OWT_MAX_BYTES: 33554432
